name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: go test ./...
      - name: Binarios Linux amd64 y arm64
        run: make build-all VERSION=${GITHUB_REF_NAME}
      - name: Unidad systemd y sumas de verificación
        run: |
          cp deploy/gestionador.service bin/
          cd bin && sha256sum gestionador-linux-* gestionador.service > SHA256SUMS
      - name: Publicar release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" bin/gestionador-linux-* bin/gestionador.service bin/SHA256SUMS --generate-notes --verify-tag
